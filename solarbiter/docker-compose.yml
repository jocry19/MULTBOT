# SOLARBITER — local / VPS stack.
#   cp .env.example .env   (edit RPC, Jupiter key, …)
#   docker compose up -d --build
#   docker compose run --rm api node apps/api/dist/cli/user.js admin   (create the dashboard user)
# Dashboard: http://127.0.0.1:8788 (bound to localhost; put a TLS reverse proxy in front for remote access)
name: solarbiter

x-app: &app
  image: solarbiter:latest
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
  env_file: [.env]
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-solarbiter}:${POSTGRES_PASSWORD:-solarbiter}@postgres:5432/${POSTGRES_DB:-solarbiter}
    REDIS_URL: redis://redis:6379
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solarbiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solarbiter}
      POSTGRES_DB: ${POSTGRES_DB:-solarbiter}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/database/backup.sh:/backup/backup.sh:ro
      - pgbackup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solarbiter} -d ${POSTGRES_DB:-solarbiter}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # one-shot: migrations + seed (idempotent), before API and worker start
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "node apps/worker/dist/cli/migrate.js && node apps/worker/dist/cli/seed.js"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-solarbiter}:${POSTGRES_PASSWORD:-solarbiter}@postgres:5432/${POSTGRES_DB:-solarbiter}
      REDIS_URL: redis://redis:6379
      WALLET_KEYSTORE_PATH: /app/secrets/bot-wallet.keystore.json
      WALLET_KEYSTORE_PASSPHRASE_FILE: /app/secrets/wallet_passphrase
    volumes:
      # encrypted keystore + passphrase file (chmod 600) — only the worker mounts them
      - ./secrets:/app/secrets:ro
      - workerlogs:/app/logs
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9464/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  api:
    <<: *app
    command: ["node", "apps/api/dist/main.js"]
    ports:
      - "127.0.0.1:${HTTP_PORT:-8788}:8788"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-solarbiter}:${POSTGRES_PASSWORD:-solarbiter}@postgres:5432/${POSTGRES_DB:-solarbiter}
      REDIS_URL: redis://redis:6379
      HTTP_PORT: "8788"
    volumes:
      - apilogs:/app/logs
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  pgbackup:
  workerlogs:
  apilogs:
