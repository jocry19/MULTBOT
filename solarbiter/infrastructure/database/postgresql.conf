# PostgreSQL settings for SOLARBITER (small VPS profile). Mounted by docker-compose.yml.
listen_addresses = '*'
max_connections = 50
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
wal_compression = on
checkpoint_timeout = 10min
max_wal_size = 1GB
log_min_duration_statement = 2000
timezone = 'UTC'
