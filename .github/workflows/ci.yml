name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: multbot
          POSTGRES_PASSWORD: multbot
          POSTGRES_DB: multbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U multbot -d multbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://multbot:multbot@localhost:5432/multbot_test
    steps:
      - uses: actions/checkout@v4

      - name: Refuse committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.keystore\.json$|(^|/)id\.json$|\.key$|(^|/)secrets/'; then
            echo "::error::secret-like files are tracked by git"; exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: multbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
