<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MULTBOT Terminal</title>
<meta name="theme-color" content="#05070d">
<meta name="description" content="Perpetual Signal Bot – Paper-Trading auf Hyperliquid">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MULTBOT">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="logo">MULTBOT</span><span class="sub">PERP SIGNAL TERMINAL</span></div>
  <div id="mode" class="badge">…</div>
  <div class="kv"><span class="k">UTC</span><span id="clk-utc" class="v">--:--:--</span></div>
  <div class="kv"><span class="k">NY</span><span id="clk-et" class="v">--:--</span></div>
  <div class="kv big"><span class="k" id="lbl-eq">PNL</span><span id="top-eq" class="v">-</span></div>
  <div class="kv"><span class="k" id="lbl-pnl">REAL. / OFFEN</span><span id="top-pnl" class="v">-</span></div>
  <div class="kv"><span class="k" id="lbl-epoch">MODUS</span><span id="top-epoch" class="v">-</span></div>
  <div class="kv"><span class="k">POS</span><span id="top-pos" class="v">-</span></div>
  <div class="kv"><span class="k">LERNEN</span><span id="top-learn" class="v">-</span></div>
  <div class="cmd">
    <span class="prompt">&gt;</span>
    <input id="cmd" autocomplete="off" spellcheck="false" placeholder="GEV &lt;GO&gt; · HELP">
    <button id="go" class="gobtn">GO</button>
  </div>
  <button id="install" class="gobtn install" title="Als App installieren (eigenes Fenster, Startmenü/Dock)" hidden>⤓ APP</button>
  <div id="conn" class="conn" title="Verbindung">●</div>
</header>
<nav id="fkeys"></nav>
<main id="page"></main>
<footer id="status">
  <div id="tape" class="tape"><div id="tape-inner"></div></div>
  <div id="statusline">Verbinde …</div>
</footer>
<div id="tooltip"></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
